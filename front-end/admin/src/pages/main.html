<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chopify Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="icon" href="../assets/images/beer-icon.png" type="image/png">
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="dashboard">
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="../assets/images/beer-icon.png" alt="Logo" class="logo">
                <h1>Chopify</h1>
            </div>
            <ul class="sidebar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="#" data-section="configuracion">
                        <i class="fas fa-cog"></i>Configuración
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-section="visualizacion">
                        <i class="fas fa-chart-bar"></i>Visualización
                    </a>
                </li>
            </ul>
        </nav>
        <div class="main-content">
            <div class="top-bar">
                <div class="user-info">
                    <!-- Información del usuario -->
                </div>
            </div>
            <div id="configuracion" class="admin-section active">
                <h2>Configuración del Sistema</h2>
                <div class="button-group">
                    <button id="startVotingBtn" class="btn btn-success">
                        <i class="fas fa-play"></i>Iniciar Votación
                    </button>
                    <button id="stopVotingBtn" class="btn btn-danger">
                        <i class="fas fa-stop"></i>Detener Votación
                    </button>
                </div>
                <div class="form-group">
                    <h3><i class="fas fa-volume-up"></i>Dispositivo de Reproducción</h3>
                    <select id="deviceSelect" class="form-select">
                        <option value="">Selecciona un dispositivo</option>
                    </select>
                    <button id="setDeviceBtn" class="btn btn-primary">
                        <i class="fas fa-check"></i>Establecer Dispositivo
                    </button>
                </div>
                <div class="form-group">
                    <h3><i class="fas fa-music"></i>Playlist por Defecto</h3>
                    <input type="text" id="playlistInput" class="form-control" placeholder="ID de la playlist">
                    <button id="setPlaylistBtn" class="btn btn-primary">
                        <i class="fas fa-save"></i>Guardar Playlist
                    </button>
                </div>
            </div>
            <div id="visualizacion" class="admin-section">
                <h2>Visualización de Datos</h2>
                <div id="rankingContainer">
                    <!-- El ranking se llenará dinámicamente -->
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
    <script src="../components/config.js"></script>
    <script src="../components/utils.js"></script>
    <script src="../components/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const navLinks = document.querySelectorAll('.nav-link');
            const sections = document.querySelectorAll('.admin-section');

            navLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetSection = this.getAttribute('data-section');

                    sections.forEach(section => {
                        if (section.id === targetSection) {
                            section.classList.add('active');
                        } else {
                            section.classList.remove('active');
                        }
                    });

                    navLinks.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
