<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chopify Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="assets/images/beer-icon.png" type="image/png">
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    <div class="login-container">
        <div class="logo-section text-center mb-4">
            <img src="assets/images/beer-icon.png" alt="Beer Icon" class="logo-icon">
            <h1 class="admin-title">Chopify <span class="highlight">Admin</span></h1>
        </div>
        <div class="oauth-login">
            <a class="spotify-button" href="http://localhost:5140/spotify-auth/login">
                <img src="assets/images/Spotify_Primary_Logo_RGB_White.png" alt="Login con Spotify">
                Iniciar sesión con Spotify
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
